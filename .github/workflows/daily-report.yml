name: Daily Report

# 매일 09:00 KST에 전날 지표를 #10_daily_report 로 보낸다.
#
# 정시 실행은 모디 봇(개발자 맥)이 09:00에 workflow_dispatch로 트리거한다.
# GitHub 예약은 정시를 보장하지 않아(2026-10-11에는 4시간 27분 지연) 예비용으로만 둔다.
# 스크립트가 같은 날짜 리포트를 이미 보냈으면 건너뛰므로 두 번 발송되지 않는다.
on:
  schedule:
    - cron: '43 0 * * *'   # 00:43 UTC = 09:43 KST, 정각 혼잡을 피한다
  workflow_dispatch:
    inputs:
      date:
        description: '집계 날짜 (YYYY-MM-DD, 비우면 어제)'
        required: false
      dry_run:
        description: 'Slack에 보내지 않고 지표만 출력'
        type: boolean
        default: false
      force:
        description: '같은 날짜 리포트를 이미 보냈어도 다시 보내기'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Prepare SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.PROD_KEY }}" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key

      - name: Send report
        env:
          TZ: Asia/Seoul
          MODY_SSH_TARGET: kminseok5167@${{ secrets.PROD_HOST }}
          MODY_SSH_KEY: /home/runner/.ssh/prod_key
          REPORT_DB_PASSWORD: ${{ secrets.REPORT_DB_PASSWORD }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_REPORT_CHANNEL: C0C82K2MKRT
          REPORT_DATE: ${{ inputs.date }}
          REPORT_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          REPORT_FORCE: ${{ inputs.force && '1' || '' }}
        run: python3 scripts/daily-report/daily_report.py
