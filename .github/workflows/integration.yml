name: CI with Gradle

# develop/main으로 가는 PR은 빌드와 테스트를 통과해야 한다.
on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test
        run: |
          chmod +x ./gradlew
          ./gradlew clean build openapi3
