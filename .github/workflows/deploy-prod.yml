name: CD Prod with Gradle

# 블루그린 무중단 배포. main 머지 시 자동으로, 또는 수동으로 실행한다.
on:
  push:
    branches:
      - main
    # 애플리케이션과 무관한 변경은 재배포하지 않는다.
    paths-ignore:
      - 'docs/**'
      - 'monitoring/**'
      - 'scripts/**'
      - 'deploy/**'
      - '.github/workflows/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      deploy:
        description: '이미지 빌드 후 운영 서버에 배포 (끄면 이미지만 올린다)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build openapi3

      # 운영 서버가 x86(GCP)에서 ARM(Oracle A1)으로 옮겨 가므로 두 아키텍처를 함께 올린다.
      # 이미지는 빌드된 jar를 복사만 하므로 QEMU 에뮬레이션 비용이 거의 없다.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build & push to Docker Hub
        run: |
          echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker buildx build -f Dockerfile --platform linux/amd64,linux/arm64 -t ${{ secrets.DOCKER_REPO }} --push .

      - name: Upload deploy script
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: kminseok5167
          key: ${{ secrets.PROD_KEY }}
          source: deploy/prod/deploy.sh
          target: mody-deploy
          strip_components: 2

      # 새 색상이 /health 를 통과해야 nginx 를 전환한다. 실패하면 기존 색상이 계속 서비스한다.
      - name: Blue-green deploy to prod server
        if: ${{ github.event_name == 'push' || inputs.deploy }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: kminseok5167
          key: ${{ secrets.PROD_KEY }}
          command_timeout: 20m
          script: bash ~/mody-deploy/deploy.sh deploy
