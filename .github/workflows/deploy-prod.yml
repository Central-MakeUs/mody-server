name: CD Prod with Gradle

# 운영 배포는 기동하는 동안(3~10분) 다운타임이 생긴다. 머지와 분리해 트래픽이 적은 시간에 수동으로 실행한다.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '이미지 빌드 후 운영 서버에 배포 (끄면 이미지만 올린다)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build openapi3

      # 운영 서버가 x86(GCP)에서 ARM(Oracle A1)으로 옮겨 가므로 두 아키텍처를 함께 올린다.
      # 이미지는 빌드된 jar를 복사만 하므로 QEMU 에뮬레이션 비용이 거의 없다.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build & push to Docker Hub
        run: |
          echo '${{ secrets.DOCKER_PASSWORD }}' | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
          docker buildx build -f Dockerfile --platform linux/amd64,linux/arm64 -t ${{ secrets.DOCKER_REPO }} --push .

      - name: Upload deploy script
        if: ${{ inputs.deploy }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: kminseok5167
          key: ${{ secrets.PROD_KEY }}
          source: deploy/prod/deploy.sh
          target: mody-deploy
          strip_components: 2

      - name: Deploy to prod server
        if: ${{ inputs.deploy }}
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: kminseok5167
          key: ${{ secrets.PROD_KEY }}
          command_timeout: 20m
          script: bash ~/mody-deploy/deploy.sh deploy
