name: CD Prod with Gradle

# 운영 배포는 기동하는 동안(3~10분) 다운타임이 생긴다. 머지와 분리해 트래픽이 적은 시간에 수동으로 실행한다.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build openapi3

      - name: Docker build & push to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile -t ${{ secrets.DOCKER_REPO }} .
          docker push ${{ secrets.DOCKER_REPO }}

      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: kminseok5167
          key: ${{ secrets.PROD_KEY }}
          source: deploy/prod/deploy.sh
          target: mody-deploy
          strip_components: 2

      - name: Deploy to prod server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: kminseok5167
          key: ${{ secrets.PROD_KEY }}
          command_timeout: 20m
          script: bash ~/mody-deploy/deploy.sh deploy
