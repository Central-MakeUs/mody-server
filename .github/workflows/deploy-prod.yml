name: CD Prod with Gradle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # 애플리케이션과 무관한 변경은 운영을 재배포하지 않는다.
    # 운영 서버는 기동에 3~10분이 걸려 불필요한 재시작 비용이 크다.
    paths-ignore:
      - 'docs/**'
      - 'monitoring/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'deploy/**'
      - '**/*.md'

permissions:
  contents: read

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew clean build openapi3

      - name: Docker build & push to Docker Hub
        run: |
          docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          docker build -f Dockerfile -t ${{ secrets.DOCKER_REPO }} .
          docker push ${{ secrets.DOCKER_REPO }}

      - name: Upload deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: kminseok5167
          key: ${{ secrets.PROD_KEY }}
          source: deploy/prod/deploy.sh
          target: mody-deploy
          strip_components: 2

      # 블루그린 배포: 새 색상이 /health 를 통과해야 nginx 를 전환한다. 기동이 최대 10분 걸린다.
      - name: Blue-green deploy to prod server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_HOST }}
          username: kminseok5167
          key: ${{ secrets.PROD_KEY }}
          command_timeout: 20m
          script: bash ~/mody-deploy/deploy.sh deploy
