apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: mody-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 300s

  - name: MySQL
    type: mysql
    uid: mody-mysql
    url: host.docker.internal:13306
    database: mody
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      maxOpenConns: 4
      maxIdleConns: 2
      timezone: Asia/Seoul
