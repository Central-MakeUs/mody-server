apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: mody-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: mody-loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # 로그의 rid 로 같은 요청의 로그를 바로 모아 본다.
      derivedFields:
        - name: requestId
          matcherRegex: "rid=([A-Za-z0-9-]+)"
          url: '{service="mody-server"} |= "rid=$${__value.raw}"'
          datasourceUid: mody-loki

  - name: MySQL
    type: mysql
    uid: mody-mysql
    url: mysql:3306
    database: mody
    user: ${GRAFANA_DB_USER}
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
    jsonData:
      maxOpenConns: 4
      maxIdleConns: 2
      timezone: Asia/Seoul
