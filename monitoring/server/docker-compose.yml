# 운영 서버(Oracle A1, 24GB) 상주 모니터링 스택.
#
#   배포:  ~/monitoring 에 이 디렉터리와 ../grafana 를 올리고
#          docker compose --env-file monitoring.env up -d
#   접속:  ssh -N -L 3000:127.0.0.1:3000 mody-prod  →  http://localhost:3000
#
# Grafana와 Prometheus는 서버의 127.0.0.1 에만 열고 SSH 터널로 접속한다.
# 앱과 MySQL은 앱 compose 네트워크(kminseok5167_mody-network)에 붙어 직접 수집한다.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mody-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [mody-network]

  grafana:
    image: grafana/grafana:11.5.1
    container_name: mody-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-grafana}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?set GRAFANA_DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [mody-network]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.16.0
    container_name: mody-mysqld-exporter
    restart: unless-stopped
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=${EXPORTER_DB_USER:-exporter}
      - --no-collect.slave_status
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD:?set EXPORTER_DB_PASSWORD}
    networks: [mody-network]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: mody-node-exporter
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [mody-network]

networks:
  mody-network:
    external: true
    name: kminseok5167_mody-network

volumes:
  prometheus-data:
  grafana-data:
