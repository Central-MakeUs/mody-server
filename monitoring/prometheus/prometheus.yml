# 운영 서버 자원이 넉넉하지 않아 스크랩 주기를 30초로 둔다.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    env: prod

scrape_configs:
  # 운영 서버 CPU가 느려 /actuator/prometheus 렌더링에 10초 이상 걸린다.
  # 주기를 60초로 늘리고 타임아웃을 넉넉히 준다.
  - job_name: mody-app
    scrape_interval: 60s
    scrape_timeout: 45s
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["mody-web-blue:8081"]
        labels:
          service: mody-server

  - job_name: mysql
    scrape_timeout: 25s
    static_configs:
      - targets: ["mody-mysqld-exporter:9104"]
        labels:
          service: mody-mysql

  - job_name: node
    static_configs:
      - targets: ["mody-node-exporter:9100"]
        labels:
          service: prod-host

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
