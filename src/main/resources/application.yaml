server:
  # 배포 시 처리 중인 요청을 마치고 내려간다(블루그린 전환 후 이전 색상 종료).
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        name: MODY_ADMIN_SESSION
        http-only: true
        secure: ${ADMIN_SESSION_COOKIE_SECURE:true}
        same-site: lax

spring:
  application:
    name: mody
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:20s}
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: existing-schema
    validate-on-migrate: true
    locations: classpath:db/migration

token:
  access-secret: ${JWT_ACCESS_SECRET:mody-local-jwt-secret-key-must-be-at-least-32-bytes}
  access-token-expiration-time: ${JWT_ACCESS_TOKEN_EXPIRATION_TIME:3600000}
  refresh-token-expiration-time: ${JWT_REFRESH_TOKEN_EXPIRATION_TIME:1209600000}

id:
  epoch-second: ${ID_EPOCH_SECOND:1767225600}
  node-id: ${ID_NODE_ID:0}

challenge:
  step-master-data-initializer:
    enabled: ${CHALLENGE_STEP_MASTER_DATA_INITIALIZER_ENABLED:true}

# 블루그린 배포: 호스트가 마운트한 파일의 색상과 server.color가 같은 인스턴스만 스케줄 작업을 실행한다.
scheduling:
  active-color-file: ${SCHEDULING_ACTIVE_COLOR_FILE:}

admin:
  api-key: ${ADMIN_API_KEY:}
  google-client-id: ${ADMIN_GOOGLE_CLIENT_ID:}
  bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:kminseok5167@gmail.com}

upload:
  provider: ${UPLOAD_PROVIDER:local}
  gcp-bucket: ${GCP_STORAGE_BUCKET:}
  base-url: ${UPLOAD_BASE_URL:https://storage.example.com}
  presigned-url-expires-in-seconds: ${UPLOAD_PRESIGNED_URL_EXPIRES_IN_SECONDS:300}

invite:
  aasa-resource-path: ${MODY_INVITE_AASA_RESOURCE_PATH:universal-link/apple-app-site-association}
  app-store-url: ${MODY_INVITE_APP_STORE_URL:https://apps.apple.com/kr/app/id6785124295}
  google-play-url: ${MODY_INVITE_GOOGLE_PLAY_URL:https://play.google.com/store}

error-alert:
  slack:
    enabled: ${SLACK_ERROR_ALERT_ENABLED:false}
    webhook-url: ${SLACK_ERROR_ALERT_WEBHOOK_URL:}
    max-message-length: ${SLACK_ERROR_ALERT_MAX_MESSAGE_LENGTH:3500}
    stack-trace-depth: ${SLACK_ERROR_ALERT_STACK_TRACE_DEPTH:8}

notification:
  dispatch:
    enabled: ${NOTIFICATION_DISPATCH_ENABLED:false}
    fixed-delay-ms: ${NOTIFICATION_DISPATCH_FIXED_DELAY_MS:10000}
    batch-size: ${NOTIFICATION_DISPATCH_BATCH_SIZE:100}
    max-retry: ${NOTIFICATION_DISPATCH_MAX_RETRY:3}
  reminder:
    enabled: ${NOTIFICATION_REMINDER_ENABLED:false}
    cron: ${NOTIFICATION_REMINDER_CRON:0 * * * * *}
  retention:
    enabled: ${NOTIFICATION_RETENTION_ENABLED:true}
    cron: ${NOTIFICATION_RETENTION_CRON:0 0 4 * * *}
    retention-days: ${NOTIFICATION_RETENTION_DAYS:7}
    batch-size: ${NOTIFICATION_RETENTION_BATCH_SIZE:500}
  streak-risk:
    enabled: ${NOTIFICATION_STREAK_RISK_ENABLED:false}
    cron: ${NOTIFICATION_STREAK_RISK_CRON:0 0 21 * * *}
    batch-size: ${NOTIFICATION_STREAK_RISK_BATCH_SIZE:500}
  push:
    provider: ${NOTIFICATION_PUSH_PROVIDER:no-op}
    title: ${NOTIFICATION_PUSH_TITLE:Mody}
    title-prefix: ${NOTIFICATION_PUSH_TITLE_PREFIX:}

fcm:
  enabled: ${FCM_ENABLED:false}
  credentials-path: ${FCM_CREDENTIALS_PATH:}

demo-login:
  enabled: ${DEMO_LOGIN_ENABLED:false}
  android-provider-user-id: ${DEMO_ANDROID_PROVIDER_USER_ID:mody-android-reviewer}
  ios-provider-user-id: ${DEMO_IOS_PROVIDER_USER_ID:mody-ios-reviewer}
  android-nickname: ${DEMO_ANDROID_NICKNAME:AndroidReviewer}
  ios-nickname: ${DEMO_IOS_NICKNAME:iOSReviewer}

oauth:
  kakao:
    authorization-uri: ${KAKAO_AUTHORIZATION_URI:https://kauth.kakao.com/oauth/authorize}
    auth-base-uri: ${KAKAO_AUTH_BASE_URI:https://kauth.kakao.com}
    api-base-uri: ${KAKAO_API_BASE_URI:https://kapi.kakao.com}
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    scope: ${KAKAO_SCOPE:}
  google:
    authorization-uri: ${GOOGLE_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
    auth-base-uri: ${GOOGLE_AUTH_BASE_URI:https://oauth2.googleapis.com}
    api-base-uri: ${GOOGLE_API_BASE_URI:https://www.googleapis.com}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    scope: ${GOOGLE_SCOPE:profile,email}
  apple:
    authorization-uri: ${APPLE_AUTHORIZATION_URI:https://appleid.apple.com/auth/authorize}
    auth-base-uri: ${APPLE_AUTH_BASE_URI:https://appleid.apple.com}
    api-base-uri: ${APPLE_API_BASE_URI:}
    client-id: ${APPLE_CLIENT_ID:com.jagsim.mody-dev}
    client-secret: ${APPLE_CLIENT_SECRET:}
    redirect-uri: ${APPLE_REDIRECT_URI:}
    scope: ${APPLE_SCOPE:email,name}
    identity-token:
      issuer: ${APPLE_ID_TOKEN_ISSUER:https://appleid.apple.com}
      audience: ${APPLE_BUNDLE_ID:com.jagsim.mody-dev}
      team-id: ${APPLE_TEAM_ID:R8ZX684WX2}
      public-key-cache-ttl-seconds: ${APPLE_PUBLIC_KEY_CACHE_TTL_SECONDS:3600}

springdoc:
  swagger-ui:
    url: /docs/openapi3.json
    disable-swagger-default-url: true

# 메트릭: 별도 포트(8081)로만 노출한다. compose에서 호스트로 포워딩하지 않으므로
# 같은 도커 네트워크 안(Prometheus 컨테이너)에서만 접근할 수 있다.
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
  prometheus:
    metrics:
      export:
        enabled: ${METRICS_EXPORT_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${SPRING_PROFILES_ACTIVE:local}
    distribution:
      # 운영 서버 CPU가 느려 버킷 히스토그램(URI x 버킷)을 켜면 스크랩 렌더링이
      # 10초를 넘는다. 인스턴스가 하나뿐이라 클라이언트 측 분위수로 충분하다.
      percentiles-histogram:
        http.server.requests: false
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99

---

spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/mody?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}

oauth:
  apple:
    client-id: ${APPLE_CLIENT_ID:com.jagsim.mody-dev}
    identity-token:
      audience: ${APPLE_BUNDLE_ID:com.jagsim.mody-dev}

