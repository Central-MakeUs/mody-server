<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MODY Admin | 챌린지 관리</title>
  <link rel="stylesheet" href="/admin/challenges/styles.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <a class="brand" href="/admin/challenges" aria-label="MODY 관리자 홈">MODY <span>ADMIN</span></a>
      <button id="sign-out-button" class="text-button" type="button" hidden>접속 해제</button>
    </header>

    <section id="access-section" class="access-layout" aria-labelledby="access-title">
      <div>
        <p class="eyebrow">운영 도구</p>
        <h1 id="access-title">챌린지 관리</h1>
        <p class="lead">그룹별 주간 사진 챌린지를 등록하고 운영합니다.</p>
      </div>
      <form id="access-form" class="panel access-form">
        <label for="admin-key">관리자 API 키</label>
        <div class="key-field">
          <input id="admin-key" name="adminKey" type="password" autocomplete="current-password" required>
          <button id="key-visibility-button" class="icon-button" type="button" aria-label="API 키 표시" title="API 키 표시">보기</button>
        </div>
        <p class="help-text">키는 이 브라우저 탭이 닫히면 삭제됩니다.</p>
        <button class="primary-button" type="submit">관리 화면 열기</button>
        <p id="access-message" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="workspace" hidden aria-labelledby="workspace-title">
      <div class="page-heading">
        <div>
          <p class="eyebrow">챌린지 운영</p>
          <h1 id="workspace-title">주간 사진 챌린지</h1>
        </div>
        <button id="refresh-groups-button" class="secondary-button" type="button">그룹 목록 새로고침</button>
      </div>

      <div class="workspace-grid">
        <form id="challenge-form" class="panel challenge-form">
          <div class="panel-heading">
            <h2>새 챌린지 등록</h2>
            <p>등록 즉시 선택한 그룹에 사진 인증 챌린지가 생성됩니다.</p>
          </div>

          <label for="group-id">대상 그룹</label>
          <select id="group-id" name="groupId" required disabled>
            <option value="">그룹 목록을 불러오는 중입니다.</option>
          </select>

          <label for="challenge-title">챌린지 제목</label>
          <input id="challenge-title" name="title" maxlength="50" placeholder="예: 엘리베이터 안 타고 올라가기" required>

          <label for="challenge-description">인증 안내</label>
          <textarea id="challenge-description" name="description" maxlength="500" rows="4" placeholder="예: 계단으로 이동한 사진을 인증해주세요." required></textarea>

          <div class="date-grid">
            <div>
              <label for="starts-on">시작일</label>
              <input id="starts-on" name="startsOn" type="date" required>
            </div>
            <div>
              <label for="ends-on">마감일</label>
              <input id="ends-on" name="endsOn" type="date" required>
            </div>
          </div>

          <button id="create-button" class="primary-button" type="submit">챌린지 등록</button>
          <p id="challenge-message" class="form-message" role="status" aria-live="polite"></p>
        </form>

        <aside class="overview" aria-label="운영 안내와 최근 등록 결과">
          <section class="overview-section">
            <p class="eyebrow">현재 연결</p>
            <strong id="group-count">그룹 목록 확인 중</strong>
            <p>운영 그룹을 선택한 뒤 인증 기간을 지정해 등록하세요.</p>
          </section>
          <section id="creation-result" class="overview-section" hidden>
            <p class="eyebrow">등록 완료</p>
            <strong id="result-title"></strong>
            <dl>
              <div><dt>그룹</dt><dd id="result-group"></dd></div>
              <div><dt>기간</dt><dd id="result-period"></dd></div>
              <div><dt>챌린지 ID</dt><dd id="result-id"></dd></div>
            </dl>
          </section>
          <section class="overview-section subtle">
            <p class="eyebrow">운영 원칙</p>
            <p>이미 진행 중인 챌린지도 유지됩니다. 중복 등록 전에는 제목과 기간을 확인하세요.</p>
          </section>
        </aside>
      </div>
    </section>
  </main>
  <script src="/admin/challenges/app.js" defer></script>
</body>
</html>
